<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bg" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#0f1a17" />
      <stop offset="1" stop-color="#0b1110" />
    </linearGradient>

    <!-- Accent gradient (teal → orange) -->
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2dd4bf" />
      <stop offset="1" stop-color="#f4a261" />
    </linearGradient>

    <!-- Accent gradient vertical for logo -->
    <linearGradient id="accent-v" x1="0" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#2dd4bf" />
      <stop offset="1" stop-color="#f4a261" />
    </linearGradient>

    <!-- Subtle radial glow top-right -->
    <radialGradient id="glow1" cx="0.85" cy="0.15" r="0.5">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity="0.08" />
      <stop offset="1" stop-color="#2dd4bf" stop-opacity="0" />
    </radialGradient>

    <!-- Subtle radial glow bottom-left -->
    <radialGradient id="glow2" cx="0.15" cy="0.85" r="0.45">
      <stop offset="0" stop-color="#f4a261" stop-opacity="0.06" />
      <stop offset="1" stop-color="#f4a261" stop-opacity="0" />
    </radialGradient>

    <!-- Noise filter for texture -->
    <filter id="noise">
      <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch" />
      <feColorMatrix type="saturate" values="0" />
      <feBlend in="SourceGraphic" mode="multiply" result="noisy" />
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.03" />
      </feComponentTransfer>
    </filter>

    <!-- Clip path for logo container -->
    <clipPath id="logoClip">
      <rect x="80" y="160" width="88" height="88" rx="22" />
    </clipPath>
  </defs>

  <!-- Base background -->
  <rect width="1200" height="630" fill="url(#bg)" />

  <!-- Ambient glow layers -->
  <rect width="1200" height="630" fill="url(#glow1)" />
  <rect width="1200" height="630" fill="url(#glow2)" />

  <!-- Noise texture overlay -->
  <rect width="1200" height="630" filter="url(#noise)" opacity="0.5" />

  <!-- Decorative grid dots (subtle) -->
  <g opacity="0.06" fill="#a7b2ad">
    <!-- Grid pattern - top area -->
    <circle cx="800" cy="80" r="1.5" />
    <circle cx="840" cy="80" r="1.5" />
    <circle cx="880" cy="80" r="1.5" />
    <circle cx="920" cy="80" r="1.5" />
    <circle cx="960" cy="80" r="1.5" />
    <circle cx="1000" cy="80" r="1.5" />
    <circle cx="1040" cy="80" r="1.5" />
    <circle cx="1080" cy="80" r="1.5" />
    <circle cx="800" cy="120" r="1.5" />
    <circle cx="840" cy="120" r="1.5" />
    <circle cx="880" cy="120" r="1.5" />
    <circle cx="920" cy="120" r="1.5" />
    <circle cx="960" cy="120" r="1.5" />
    <circle cx="1000" cy="120" r="1.5" />
    <circle cx="1040" cy="120" r="1.5" />
    <circle cx="1080" cy="120" r="1.5" />
    <circle cx="800" cy="160" r="1.5" />
    <circle cx="840" cy="160" r="1.5" />
    <circle cx="880" cy="160" r="1.5" />
    <circle cx="920" cy="160" r="1.5" />
    <circle cx="960" cy="160" r="1.5" />
    <circle cx="1000" cy="160" r="1.5" />
    <circle cx="1040" cy="160" r="1.5" />
    <circle cx="1080" cy="160" r="1.5" />
    <circle cx="800" cy="200" r="1.5" />
    <circle cx="840" cy="200" r="1.5" />
    <circle cx="880" cy="200" r="1.5" />
    <circle cx="920" cy="200" r="1.5" />
    <circle cx="960" cy="200" r="1.5" />
    <circle cx="1000" cy="200" r="1.5" />
    <circle cx="1040" cy="200" r="1.5" />
    <circle cx="1080" cy="200" r="1.5" />
  </g>

  <!-- Decorative geometric shapes -->
  <!-- Large ring top-right -->
  <circle cx="1060" cy="120" r="100" fill="none" stroke="#2dd4bf" stroke-width="1" opacity="0.06" />
  <circle cx="1060" cy="120" r="60" fill="none" stroke="#2dd4bf" stroke-width="0.5" opacity="0.04" />

  <!-- Subtle diagonal lines bottom-right -->
  <g opacity="0.04" stroke="#f4a261" stroke-width="0.8">
    <line x1="950" y1="630" x2="1200" y2="380" />
    <line x1="1000" y1="630" x2="1200" y2="430" />
    <line x1="1050" y1="630" x2="1200" y2="480" />
  </g>

  <!-- Logo container with background -->
  <rect x="80" y="160" width="88" height="88" rx="22" fill="#16211f" />
  <rect x="80" y="160" width="88" height="88" rx="22" fill="none" stroke="#26332f" stroke-width="1" />

  <!-- M logo (scaled from favicon) -->
  <g transform="translate(80, 160) scale(1.375)">
    <path
      d="M16 46V18h8l8 18 8-18h8v28h-6V28l-7 18h-6l-7-18v18h-6z"
      fill="url(#accent-v)"
    />
  </g>

  <!-- Name -->
  <text x="80" y="310" font-family="'Space Grotesk', -apple-system, system-ui, sans-serif" font-size="56" font-weight="700" fill="#f2f5f3" letter-spacing="-1">
    Matheus Cabral
  </text>

  <!-- Title / tagline -->
  <text x="80" y="368" font-family="'Space Grotesk', -apple-system, system-ui, sans-serif" font-size="28" font-weight="400" fill="#a7b2ad">
    Data Engineer · ETL Pipelines · Analytics Platforms
  </text>

  <!-- Accent gradient bar -->
  <rect x="80" y="405" width="260" height="5" fill="url(#accent)" rx="2.5" />

  <!-- Tech stack pills -->
  <g font-family="'IBM Plex Mono', 'SF Mono', monospace" font-size="15" font-weight="500">
    <!-- Python pill -->
    <rect x="80" y="440" width="90" height="34" rx="17" fill="#1a2926" stroke="#26332f" stroke-width="1" />
    <text x="125" y="462" fill="#2dd4bf" text-anchor="middle">Python</text>

    <!-- PySpark pill -->
    <rect x="184" y="440" width="100" height="34" rx="17" fill="#1a2926" stroke="#26332f" stroke-width="1" />
    <text x="234" y="462" fill="#2dd4bf" text-anchor="middle">PySpark</text>

    <!-- SQL pill -->
    <rect x="298" y="440" width="66" height="34" rx="17" fill="#1a2926" stroke="#26332f" stroke-width="1" />
    <text x="331" y="462" fill="#2dd4bf" text-anchor="middle">SQL</text>

    <!-- Databricks pill -->
    <rect x="378" y="440" width="120" height="34" rx="17" fill="#1a2926" stroke="#26332f" stroke-width="1" />
    <text x="438" y="462" fill="#2dd4bf" text-anchor="middle">Databricks</text>

    <!-- Power BI pill -->
    <rect x="512" y="440" width="108" height="34" rx="17" fill="#1a2926" stroke="#26332f" stroke-width="1" />
    <text x="566" y="462" fill="#2dd4bf" text-anchor="middle">Power BI</text>
  </g>

  <!-- Bottom border accent line -->
  <rect x="0" y="622" width="1200" height="8" fill="url(#accent)" />

  <!-- URL in bottom-left -->
  <text x="80" y="590" font-family="'IBM Plex Mono', 'SF Mono', monospace" font-size="16" font-weight="400" fill="#6b7f78" letter-spacing="0.5">
    matheuscabral.dev
  </text>

  <!-- Location in bottom-right area -->
  <text x="1120" y="590" font-family="'IBM Plex Mono', 'SF Mono', monospace" font-size="16" font-weight="400" fill="#6b7f78" letter-spacing="0.5" text-anchor="end">
    Lisbon, Portugal
  </text>
</svg>
